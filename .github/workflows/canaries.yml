name: canaries

# Renders the canary goldens with the action itself. They were committed from a Mac
# running golden-run, so passing here proves Mac and CI produce identical bytes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  canaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          working-directory: canary
