name: image

# Builds golden-env for the Flutter versions in golden-env/versions that aren't on
# ghcr.io/<owner>/golden-env yet. Native x86-64, no emulation.
#
# A published tag is only rebuilt by hand: apt installs whatever Debian ships that
# day, so a rebuild moves the tag to a new digest.
on:
  push:
    branches: [main]
    paths: [golden-env/**, .github/workflows/image.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Version to rebuild. Empty builds only unpublished versions.
        required: false
        default: ''

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        env:
          REQUESTED: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repository="${OWNER,,}/golden-env"
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:$repository:pull" | jq -r .token)
          matrix=()
          while read -r version commit; do
            if [ -n "$REQUESTED" ]; then
              [ "$REQUESTED" = "$version" ] || continue
            else
              status=$(curl -sS -o /dev/null -w '%{http_code}' --head \
                -H "Authorization: Bearer $token" \
                -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
                "https://ghcr.io/v2/$repository/manifests/$version")
              case $status in
                200) echo "$version is published, skipping"; continue ;;
                404) ;;
                # Anything else could be a published tag: rebuilding it would move it.
                *) echo "::error::ghcr.io answered $status for $version"; exit 1 ;;
              esac
            fi
            echo "$version will be built"
            matrix+=("$(jq -nc --arg version "$version" --arg commit "$commit" '{$version, $commit}')")
          done < <(awk '!/^#/ && NF' golden-env/versions)
          if [ -n "$REQUESTED" ] && [ ${#matrix[@]} -eq 0 ]; then
            echo "::error::$REQUESTED is not in golden-env/versions"
            exit 1
          fi
          echo "matrix=[$(IFS=,; echo "${matrix[*]}")]" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    if: needs.versions.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    strategy:
      # One version failing to build must not cancel the others.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/golden-env" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: golden-env
          platforms: linux/amd64
          # One plain manifest: no attestation manifests for clients to skip.
          provenance: false
          sbom: false
          build-args: |
            FLUTTER_VERSION=${{ matrix.version }}
            FLUTTER_COMMIT=${{ matrix.commit }}
          tags: ${{ steps.name.outputs.image }}:${{ matrix.version }}
          push: true
          cache-from: type=gha,scope=${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.version }}

      # Stored in GitHub's attestation store only: pushing it to the registry adds a
      # sha256-<digest> tag and an untagged version to the package on every build.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}

      - name: Summary
        env:
          LOCK: image=${{ steps.name.outputs.image }}:${{ matrix.version }}@${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Flutter ${{ matrix.version }}"
            echo '```ini'
            echo "$LOCK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
