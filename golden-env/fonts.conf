<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Render is governed only by what Skia asks FreeType for: no hinting or subpixel
     settings injected by fontconfig defaults. -->
<fontconfig>
  <dir>/usr/share/fonts/golden</dir>
  <match target="font"><edit name="hinting" mode="assign"><bool>false</bool></edit></match>
  <match target="font"><edit name="autohint" mode="assign"><bool>false</bool></edit></match>
  <match target="font"><edit name="rgba" mode="assign"><const>none</const></edit></match>
</fontconfig>
